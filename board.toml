# Board description of the Benesse TAB-A04-BR3 (a04br3, MediaTek MT8167), read by the unixnu build driver.
# Hardware values come from the earlier a04br3 ports by the same maintainer, which ran on this tablet:
#   github.com/mouseos/xnu_kernel_benesse_a04br3, github.com/mouseos/xnu_bootshim_benesse_a04br3 (XNU on MT8167)
#   github.com/mouseos/edk2-mtk (branch a04br3-upstream-port, EDK II on MT8167)

[board]
name = "a04br3"
soc = "MT8167"
description = "Benesse TAB-A04-BR3"
kit = "a04br3"                     # the package/ of this repository appears as kits/a04br3 in the build tree

# The target OS image: the unchanged iPad7,1 iPadOS 17.7.11 restore image, the UniXNU default target (Darwin 23,
# matching the xnu-10063 source kernel). Give --ipsw PATH to use a local file.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# The eMMC (MSDC0) uses 512-byte sectors. The userdata entry of the a04br3 GPT in scripts/make-a04br3-gpt.py:
# the Android-only partitions (factory, metadata, system, cache) are removed and userdata runs to flashinfo.
[userdata]
first_lba = 557056
last_lba = 30501887
lba_bytes = 512
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "a04br3_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  # NativeRamBlock (the Data RAM disk) and the NativeMsdc userdata windows (CONFIG_XNU_NATIVE_MSDC_BLOCK=y) subclass the original
  # IOBlockStorageDevice. build-native-virtio-bindings.py binds them with build/storage-abi/interface-audit.json when present,
  # otherwise with UniXNU scripts/data/native-storage-interface-audit.json (scripts/record-storage-interface.py), the static record
  # of the kernelcache and slide of [kernel.prelink] below.
  # Owner root chain (CONFIG_XNU_OWNER_ROOT_TRUST): iPadOS mounts the root only when it is authenticated. The verified
  # NativeVirtioBlock carries native_verified_block_root_authorized(), which asks NativeMsdc about its windows; NativeMsdc
  # verifies every block against the owner-signed envelopes in userdata (scripts/make-a04br3-root-policy.py); the root key
  # archive carries the owner anchor, VerifiedRoot and the anchor self-test (CONFIG_XNU_VERIFIED_ROOT_ARCHIVE).
  "build-arm-driver.py NativeVirtioBlock --verified-root",
  "build-native-virtio-bindings.py --component NativeVirtioBlock --directory build/native-virtio-block-verified",
  "build-a04br3-root-key.py",
  "build-arm-driver.py NativeRamBlock",
  "build-native-virtio-bindings.py --component NativeRamBlock --directory build/native-ram-block",
  # NativeMsdc: the eMMC (MSDC0) driver. Without CONFIG_XNU_NATIVE_MSDC_BLOCK it builds the persistent store only.
  "build-arm-driver.py NativeMsdc --verified-root",
  "build-native-virtio-bindings.py --component NativeMsdc --block-class NativeMsdcBlock --directory build/native-msdc",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  # The AppleKeyStore stand-in of UniXNU (drivers/NativeKeyStoreEvents); build-a04br3-board.py stages it into the board
  # archive with KeyStoreProbe.cpp (offline-key-events=1, sheng-aks=1).
  "build-arm-driver.py NativeKeyStoreEvents",
  "build-a04br3-board.py",
  # The original-PMGR bridge (CONFIG_XNU_SHENG_PMGR, kernel argument sheng-pmgr=2): AMFI requires a published PMGR
  # ("AMFI: No PMGR?" without it). Generic and hardware-free; from UniXNU-tb128fu/UniXNU-sheng.
  "build-platform-power.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

[firmware]
config = "a04br3"                  # Resources/Configs/a04br3.toml in the uefi-a04br3 checkout (--uefi)
dsc = "Platforms/Benesse/a04br3Pkg/a04br3.dsc"
fd = "Build/a04br3Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Benesse",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/MediaTek",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
]

[firmware.defines]
DEVICE_MODEL = "a04br3"
BUILDID_STRING = "a04br3-bringup"
# Bring-up: uefi-a04br3 a04br3Pkg sets the LK fastboot flag and arms the 31 s watchdog from SEC on
# (A04BR3PlatformSecBoardLib), A04BR3TestCycleDxe kicks it until ExitBootServices (at most 120 s) and re-arms it there,
# so firmware or a kernel that stops before a04br3-autoreset (package/A04BR3AutoReset.cpp) takes over still resets
# into fastboot. Remove together with a04br3-autoreset for a release image.
A04BR3_TEST_CYCLE = "1"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and the optional
# trust cache and Data seed. The loader (DarwinBoot) is part of the firmware volume.
[payload]
volume = "A04BR3ESP"
size_mib = 96
loader = "firmware"
title = "Boot"
dram_size = "0x80000000"             # 2 GiB at 0x40000000 (MT8167 EMI, LK memory node)
# panic_screen needs a device scripts/patch-xnu-entry-probe.py (UniXNU-sheng); a04br3 reports panics on UART.
panic_screen = false
skip_setup_tool = "scripts/seed-data-skip-setup.py"
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "-apfs_shared_datavolume",
  "-no_slto_panic",
  # eMMC: publish the userdata windows (OS, SystemOS) read-only; nothing is written to the eMMC.
  "native-msdc-root=1",
  # Publish the original PMGR nub through the bridge (build-platform-power.py); it reads and writes no hardware.
  "sheng-pmgr=2",
  # Bring-up: the process list on UART every 20 s (package/A04BR3Board.cpp); remove for a release image.
  "a04br3-proclog=20",
  # Bring-up: every reset returns to LK fastboot for the unattended cycle (package/A04BR3AutoReset.cpp). Remove for a
  # release image.
  "a04br3-autoreset=900",
  # After the PMGR bridge: the launchd-side arguments of UniXNU-tb128fu (board.toml) and UniXNU-sheng that need no display.
  # No corpses for crashing processes (stock XNU osfmk/corpses/corpse.c): on tb128fu each corpse's footprint walk took half
  # of all CPU samples while daemons without a GPU crashed in loops; a04br3 has one Cortex-A35.
  "-no_corpses",
  # Stock XNU lock-panic timeout (osfmk/arm/locks_arm.c, 0xc00000 timebase ticks) times 40, as on tb128fu and sheng.
  "ml-timeout-lock-panic-scale=40",
  # The AppleKeyStore stand-in (package/KeyStoreProbe.cpp, UniXNU drivers/NativeKeyStoreEvents), started from
  # unixnu_board_init(): the notification service and the state answers (no passcode, nothing locked). It holds no keys.
  "offline-key-events=1",
  "sheng-aks=1",
  # launchd's disabled jobs (package/BootWatchdogPolicy.c labels; written into the Data seed by
  # scripts/a04br3-seed-launch-policy.py, and by unixnu_board_launch() once CONFIG_XNU_BOARD_LAUNCH reaches UniXNU).
  # watchdogd: no AppleARMWatchdogTimer here (not in [kernel.prelink] roots); on tb128fu it trapped about 5 minutes in
  # and its exit is fatal. The jobs are tb128fu's set without a GPU: the SpringBoard wait cycle (identityservicesd,
  # locationd), radios (CommCenter, bluetoothd) and the respawn/crash loops (PerfPowerServices, iomfb_fdr_loader,
  # iconservicesagent).
  "sheng-disable-watchdogd=1",
  "sheng-disable-jobs=com.apple.identityservicesd,com.apple.locationd,com.apple.CommCenter,com.apple.bluetoothd,com.apple.PerfPowerServices,com.apple.iomfb_fdr_loader,com.apple.iconservices.iconservicesagent",
]

[payload.adt]
tool = "scripts/make-a04br3-adt.py"
chip_id = "8167"
# The XNU window (DarwinBoot AllocateWindow, first fit from low addresses): one contiguous run of conventional memory.
# LK places the boot ramdisk at 0x80000000 (uefi-a04br3 MemoryMapLib "Boot Ramdisk", 0x80000000-0x88000000) and PrePi
# takes DxeCore and page tables from the top of "DXE Heap", so "DDR Mid 2" (0x52000000-0x80000000, 736 MiB) is the
# largest run the firmware leaves untouched. The window start adds the low bits of the kernel base (0x4000), so
# 0x2DE00000 (734 MiB) always fits there; "DDR High" (873 MiB) is shared with firmware allocations and the payload files.
owned_memory_size = "0x2DE00000"
# The volume UUID of the OS window: the unchanged 21H461 OS disk image, the same value as UniXNU-sheng.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
cpu_regs = "0"
psci_method = "smc"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository
