schema_version = 1

[device]
name = "a04br3"
soc = "MT8167"
os_profile = "ipados-17.7.11-21H461"
summary = "Benesse TAB-A04-BR3 (MediaTek MT8167, 4x Cortex-A35, GIC-400, 2 GiB DRAM, eMMC). iPadOS 17.7.11 boots to the home screen with GPU (PowerVR GE8300) composition, eMMC HS200 and the CPU at 1.3 GHz. This branch is the format 2 port (SoC repository UniXNU-mt8167-common, iPadOS 17.7.11 profile, canonical component names, dts/a04br3.dts), built by scripts/package.sh from UniXNU main with the a04br3 pull requests (mouseos/UniXNU format2/integration)."

