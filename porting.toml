inputs = ["4x Cortex-A35 (MPIDR 0..3), PSCI smc, GIC-400 (GICv2), generic timer 13 MHz; ARMPLL and VPROC (MT6392) for the 1.3 GHz OPP of the stock CT3 kernel"]
configuration = ["[payload.adt] cpu_regs 0,1,2,3, psci_method smc; kernel argument sheng-smp=1; firmware define A04BR3_CPU_1300 (VPROC 1.20 -> 1.30 V, then ARMPLL 1001 -> 1300 MHz, once in SEC, RTC_SPAR0 bit 12 re-entry guard)"]
procedure = ["Boot with a04br3_pmu_defconfig and cc=1; ArmCpu cycle-clock counts PMU cycles over 13001 ticks of the 13 MHz timer on each secondary CPU"]
findings = ["The measured clock was 1001 MHz before the switch; after it the PMU gives about 1,300,000 cycles per 13001 ticks. A reset between the voltage raise and the clock switch is caught by the RTC_SPAR0 guard."]
completion = ["All four CPUs run; the PMU confirms the configured frequency."]
limits = ["No DVFS; the clock is set once at boot."]
next_action = ["Thermal monitoring under sustained load at 1.3 GHz."]
