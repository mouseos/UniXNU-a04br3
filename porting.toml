findings = ["Persistent boot log (UniXNU log-capture guide): native-msdc-log=1 opens the last 8 MiB of userdata (LBA 30485504..30501887, NativeMsdc a04br3/boot-log), package/A04BR3BootLog.c keeps the last 4 boots in 8 slots, the uefi-a04br3 reader (A04BR3_LOG_READER) prints the newest verified slot on UART at the next boot and scripts/read-a04br3-log.py decodes it. Host-tested (scripts/tests/test_bootlog.py); hardware trial pending.","Format 2: BootProcessProbe.c carries a weak native_irq_pc_hook_compiled default so the kernel links without the optional IRQ PC patch.","Every reset (UART request, timer, watchdog or panic) returns to LK fastboot, so images are written without mtkclient or touching the tablet."]
completion = ["Each round leaves its UART log and returns to fastboot."]
limits = ["No persistent storage log region or QR firmware log; UART is the log transport."]
