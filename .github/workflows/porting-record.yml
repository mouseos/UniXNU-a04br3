name: Device documentation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  porting-record:
    name: Porting record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: mouseos/UniXNU
          ref: b76746395b55206c28c91f5097bf52be5891d2f4
          path: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migration record against paired catalog
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            python3 tools/scripts/porting-record.py check --device device
          else
            python3 tools/scripts/porting-record.py check --device device --base "$BASE"
          fi
